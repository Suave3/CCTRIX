version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: cctrix-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cctrix_secure_password
      POSTGRES_DB: cctrix_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
